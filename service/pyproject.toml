[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ksp-aihub"
version = "0.4.0"
authors = [{name = "fubuki11st"}]
description = "Provider-neutral local AI gateway for KSP mods"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/fubuki11/KSP-AIHub"

[project.scripts]
ksp-aihub = "ksp_aihub.__main__:main"

[tool.setuptools]
packages = ["ksp_aihub"]
